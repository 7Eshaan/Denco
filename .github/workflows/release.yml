# Pushing a version tag (git tag v0.1.0 && git push origin v0.1.0) tests the
# code, builds binaries for Linux, macOS and Windows (amd64 and arm64) and
# publishes them as a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -race ./...

  release:
    needs: test # nothing is published unless every test passed
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job may create the release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: build archives
        run: scripts/release-build.sh "$GITHUB_REF_NAME"
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --title "Denco $GITHUB_REF_NAME" --generate-notes --verify-tag

  # Publishes the Homebrew formula (DECISIONS D68) to the tap repository,
  # github.com/<owner>/homebrew-tap, so `brew install 7Eshaan/tap/denco`
  # gets this release. Needs the TAP_TOKEN secret: a fine-grained token
  # that can write only to that repository. Without it this job just warns.
  # Pre-releases (v1.2.0-rc1) don't go to the tap.
  homebrew:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: check for the tap token
        id: token
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAP_TOKEN isn't set, so the Homebrew tap wasn't updated (see DECISIONS D68)"
          fi
      - uses: actions/checkout@v5
        if: steps.token.outputs.ok == 'true'
      - uses: actions/checkout@v5
        if: steps.token.outputs.ok == 'true'
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap
      - name: write the formula
        if: steps.token.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir dist
          mkdir -p tap/Formula
          scripts/brew-formula.sh "$GITHUB_REF_NAME" dist/SHA256SUMS > tap/Formula/denco.rb
          cat tap/Formula/denco.rb
      - name: push it to the tap
        if: steps.token.outputs.ok == 'true'
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/denco.rb
          if git diff --cached --quiet; then
            echo "The formula is already up to date."
          else
            git commit -m "denco $GITHUB_REF_NAME"
            git push
          fi
